<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071c16"><title>SHOHIN LUGHAT</title>
<style>
:root{--bg:#071c16;--panel:#0d3024;--green:#08a56c;--gold:#d9b45b;--ivory:#f4f0e5;--muted:#9eb8aa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#17533d 0,transparent 40%),var(--bg);color:var(--ivory);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:24px 18px 48px}.top{display:flex;align-items:center;gap:13px;margin-bottom:30px}.logo{width:48px;height:48px;border:1px solid #b98f3c;border-radius:15px;display:grid;place-items:center;color:var(--gold);font-size:23px;background:#102a20}.brand{font-weight:800;letter-spacing:2px}.sub{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:3px}
.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:30px 0 22px}.eyebrow{color:var(--gold);letter-spacing:2px;font-size:11px;font-weight:700}.hero h1{font-size:clamp(30px,6vw,48px);line-height:1.05;margin:10px 0}.hero p{color:var(--muted);margin:0;max-width:520px}.pill{border:1px solid #315b47;color:#b9d8c7;padding:9px 13px;border-radius:30px;font-size:12px;white-space:nowrap}
.panel{background:linear-gradient(145deg,#103728,#0b281f);border:1px solid #234b38;border-radius:22px;padding:18px;box-shadow:0 18px 50px #0003}.switch{display:flex;gap:8px;margin-bottom:16px}.switch button,.chips button{border:1px solid #315541;background:#102b21;color:#b6cbbf;border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}.switch button.active{background:var(--green);color:white;border-color:var(--green)}
.search{display:flex;gap:10px}.search input{flex:1;min-width:0;background:#071c16;border:1px solid #315541;border-radius:14px;padding:15px;color:white;font:inherit;outline:none}.search input:focus{border-color:var(--gold)}.search button{background:var(--gold);border:0;color:#1d2419;font-weight:800;border-radius:14px;padding:0 20px}
.chips{display:flex;gap:8px;overflow:auto;padding:16px 0 5px}.chips button{white-space:nowrap;font-size:12px;padding:8px 12px}.chips button.active{border-color:var(--gold);color:var(--gold)}
.section{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 12px}.section strong{font-size:17px}.section span{color:var(--muted);font-size:12px}
.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.word{padding:16px;background:#0c2a20;border:1px solid #204532;border-radius:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.en{font-weight:700;font-size:16px}.tj{color:#b8cbbb;margin-top:5px}.star{border:0;background:none;color:var(--gold);font-size:21px;cursor:pointer}
.note{margin-top:22px;color:#77988a;font-size:12px;text-align:center}
@media(max-width:600px){.hero{align-items:start;flex-direction:column}.words{grid-template-columns:1fr}.search button{padding:0 13px}.wrap{padding:18px 14px 36px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="logo">♛</div><div><div class="brand">SHOHIN</div><div class="sub">TAJIKISTAN · LANGUAGE TOOLS</div></div></header>
<section class="hero"><div><div class="eyebrow">OFFLINE DICTIONARY · PREVIEW</div><h1>SHOHIN LUGHAT</h1><p>Англо-таджикский и таджикско-английский словарь. Быстрый поиск, тематические категории и избранные слова.</p></div><div class="pill">ENGLISH ⇄ ТОҶИКӢ</div></section>
<section class="panel"><div class="switch"><button id="en" class="active" onclick="direction('en')">English → Тоҷикӣ</button><button id="tj" onclick="direction('tj')">Тоҷикӣ → English</button></div><div class="search"><input id="q" placeholder="Введите слово для поиска..." oninput="render()"><button onclick="document.getElementById('q').value='';render()">Очистить</button></div><div class="chips" id="chips"></div></section>
<div class="section"><strong>Слова дня</strong><span id="count">12 слов</span></div><section class="words" id="words"></section><div class="note">SHOHIN TAJIKISTAN · ДЕМО-ВЕРСИЯ · Работа без API и базы данных</div>
</main>
<script>
const data=[['apple','себ','Food'],['water','об','Food'],['bread','нон','Food'],['book','китоб','Education'],['teacher','омӯзгор','Education'],['school','мактаб','Education'],['friend','дӯст','People'],['family','оила','People'],['house','хона','Home'],['beautiful','зебо','Daily life'],['knowledge','дониш','Education'],['journey','сафар','Travel']];
const cats=['Ҳама','Food','Education','People','Home','Daily life','Travel'];let dir='en',cat='Ҳама',favs=new Set();
function direction(d){dir=d;document.getElementById('en').classList.toggle('active',d==='en');document.getElementById('tj').classList.toggle('active',d==='tj');document.getElementById('q').placeholder=d==='en'?'Search English or Tajik word...':'Ҷустуҷӯи калимаи тоҷикӣ...';render()}
function render(){let q=document.getElementById('q').value.toLowerCase().trim();document.getElementById('chips').innerHTML=cats.map(c=>'<button class="'+(cat===c?'active':'')+'" onclick="cat=\''+c+'\';render()">'+(c==='Ҳама'?'Все':c)+'</button>').join('');let list=data.filter(x=>(cat==='Ҳама'||x[2]===cat)&&(!q||x[0].includes(q)||x[1].includes(q)));document.getElementById('count').textContent=list.length+' слов';document.getElementById('words').innerHTML=list.map(x=>'<article class="word"><div><div class="en">'+(dir==='en'?x[0]:x[1])+'</div><div class="tj">'+(dir==='en'?x[1]:x[0])+'</div></div><button class="star" onclick="toggle(\''+x[0]+'\')">'+(favs.has(x[0])?'★':'☆')+'</button></article>').join('')||'<p style="color:#9eb8aa">Ничего не найдено</p>'}
function toggle(w){favs.has(w)?favs.delete(w):favs.add(w);render()}render();
</script></body></html>
