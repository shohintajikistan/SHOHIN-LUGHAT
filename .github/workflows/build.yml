name: Prepare SHOHIN LUGHAT dictionary data

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build universal Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare complete offline dictionary
        run: python3 tools/prepare_dictionary.py

      - name: Publish complete dictionary for GitHub Pages
        run: |
          git add dictionary/words.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build complete web dictionary from frozen groups"
            git push
          fi

      - name: Validate complete offline dictionary
        run: python3 tools/validate_dictionary.py app/src/main/assets/dictionary/words.json

      - name: Package website and story images for offline Android use
        run: python3 tools/prepare_android_web.py

