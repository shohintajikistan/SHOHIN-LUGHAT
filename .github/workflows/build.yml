name: Build SHOHIN LUGHAT APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build universal Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare complete offline dictionary
        run: python3 tools/prepare_dictionary.py

      - name: Validate complete offline dictionary
        run: python3 tools/validate_dictionary.py app/src/main/assets/dictionary/words.json

      - name: Package website and story images for offline Android use
        run: python3 tools/prepare_android_web.py

      - name: Build universal debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SHOHIN-LUGHAT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
