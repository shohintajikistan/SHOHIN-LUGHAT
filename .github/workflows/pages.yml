name: Deploy SHOHIN LUGHAT preview
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'dictionary/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble and validate full dictionary for website
        run: |
          python3 tools/prepare_dictionary.py
          python3 tools/validate_dictionary.py app/src/main/assets/dictionary/words.json
          cp app/src/main/assets/dictionary/words.json dictionary/words.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
